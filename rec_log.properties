# log4j.rootLogger=REC

log4j.logger.org.psp=INFO,REC
log4j.appender.REC=org.apache.log4j.RollingFileAppender
log4j.appender.REC.File=recognition.log
log4j.appender.REC.MaxFileSize=10Mb
log4j.appender.REC.MaxBackupIndex=5
log4j.appender.REC.layout=org.apache.log4j.PatternLayout
log4j.appender.REC.layout.conversionPattern=%d{dd.MM.yyyy HH\:mm\:ss.SSS} [%-5p] <%t> <%c{2}> - %m%n
